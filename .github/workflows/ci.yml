name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "tests/**"
      - "ci/**"
      - "feature/**"
      - "fix/**"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  JAVA_VERSION: "21"
  COMPOSE_FILE: infra/docker-compose.yml
  TC_URL: http://localhost:8111
  TC_ADMIN_USER: admin
  TC_ADMIN_PASS: admin
  TC_DATADIR: infra/teamcity-server/data
  TEAMCITY_IMAGE: jetbrains/teamcity-server:2026.1.1
  TEAMCITY_BACKUP_TAG: teamcity-backup-v1
  ARTIFACT_RETENTION_DAYS: "7"

jobs:
  build_and_lint:
    name: Build + Checkstyle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java + Maven
        uses: ./.github/actions/setup-java-maven
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile
        run: ./mvnw -B -DskipTests compile test-compile

      - name: Checkstyle gate
        run: ./mvnw -B -Dcheckstyle.skip=false checkstyle:check

  api_tests:
    name: API tests
    needs: build_and_lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      surefire_summary: ${{ steps.summary.outputs.text }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java + Maven
        uses: ./.github/actions/setup-java-maven
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Make scripts / wrapper executable
        run: |
          chmod +x .github/scripts/*.sh
          chmod +x mvnw

      - name: Pull TeamCity images
        run: docker compose -f "${COMPOSE_FILE}" pull teamcity-server teamcity-agent

      - name: Seed TeamCity datadir from release backup
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: .github/scripts/seed-teamcity-datadir.sh "${TC_DATADIR}"

      - name: Prepare TeamCity agent directories
        run: |
          mkdir -p infra/teamcity-agent/conf infra/teamcity-agent/work
          chmod -R a+rwx infra/teamcity-agent

      - name: Start TeamCity server
        run: docker compose -f "${COMPOSE_FILE}" up -d teamcity-server

      - name: Start backend stack
        run: docker compose -f "${COMPOSE_FILE}" up -d postgres backend

      - name: Wait for TeamCity HTTP
        run: |
          if ! .github/scripts/wait-for-url.sh "${TC_URL}/login.html" 420 10; then
            echo "::error::TeamCity HTTP did not become ready"
            docker compose -f "${COMPOSE_FILE}" ps -a || true
            docker compose -f "${COMPOSE_FILE}" logs --no-color --tail=200 teamcity-server || true
            exit 1
          fi

      - name: Wait for backend
        run: .github/scripts/wait-for-url.sh "http://localhost:4111/actuator/health" 180 5

      - name: Bootstrap TeamCity
        run: .github/scripts/bootstrap-teamcity.sh "${TC_URL}" "${TC_ADMIN_USER}" "${TC_ADMIN_PASS}"

      - name: Wait for TeamCity REST (authenticated)
        run: .github/scripts/wait-for-teamcity-ready.sh "${TC_URL}" "${TC_ADMIN_USER}" "${TC_ADMIN_PASS}" 600 10

      - name: Purge TeamCity agents from backup
        run: .github/scripts/authorize-teamcity-agent.sh purge "${TC_URL}" "${TC_ADMIN_USER}" "${TC_ADMIN_PASS}"

      - name: Start TeamCity agent
        run: docker compose -f "${COMPOSE_FILE}" up -d teamcity-agent

      - name: Disable agent auto-upgrade
        run: |
          CONF=infra/teamcity-agent/conf/buildAgent.properties
          for i in $(seq 1 60); do
            [[ -f "${CONF}" ]] && break
            sleep 2
          done
          if [[ ! -f "${CONF}" ]]; then
            echo "::warning::Agent conf not found, skip upgrade disable"
            exit 0
          fi
          if grep -q 'teamcity.agent.upgrade.disabled=true' "${CONF}"; then
            echo "Auto-upgrade already disabled"
            exit 0
          fi
          sudo chmod a+rw "${CONF}" || chmod a+rw "${CONF}" || true
          echo 'teamcity.agent.upgrade.disabled=true' | sudo tee -a "${CONF}" >/dev/null
          docker restart teamcity-agent
          sleep 20

      - name: Authorize connected TeamCity agent
        run: .github/scripts/authorize-teamcity-agent.sh "${TC_URL}" "${TC_ADMIN_USER}" "${TC_ADMIN_PASS}" 420 5

      - name: Smoke API gate
        run: >
          ./mvnw -B test
          -Denv=ci-host
          -Dgroups=smoke
          -Dexclude.groups=
          -Dsurefire.parallel=none
          -Djunit.parallel.enabled=false

      - name: Full API tests (exclude UI + already-run smoke)
        run: >
          ./mvnw -B test
          -Denv=ci-host
          -Dexclude.groups=ui,smoke
          -Dsurefire.parallel=none
          -Djunit.parallel.enabled=false

      - name: Surefire summary
        id: summary
        if: always()
        run: |
          TEXT="$(.github/scripts/surefire-summary.sh target/surefire-reports)"
          echo "text<<EOF" >> "$GITHUB_OUTPUT"
          echo "${TEXT}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "${TEXT}"

      - name: Generate Allure report
        if: always()
        continue-on-error: true
        run: |
          if [[ -d target/allure-results ]] && find target/allure-results -type f | grep -q .; then
            ./mvnw -B allure:report
          else
            echo "No allure-results — skip report generation"
          fi

      - name: Collect docker logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose -f "${COMPOSE_FILE}" logs --no-color > artifacts/docker-compose.log || true

      - name: Upload API artifacts
        if: always()
        uses: ./.github/actions/upload-ci-artifacts
        with:
          name: api-artifacts
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          path: |
            target/surefire-reports/**
            target/allure-results/**
            target/site/allure-maven-plugin/**
            artifacts/docker-compose.log

      - name: Stop stack
        if: always()
        run: docker compose -f "${COMPOSE_FILE}" down -v

  ui_tests_chrome:
    name: UI tests (Chrome / Selenoid)
    needs: build_and_lint
    if: ${{ needs.build_and_lint.result == 'success' && vars.ENABLE_UI_MATRIX == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java + Maven
        uses: ./.github/actions/setup-java-maven
        with:
          java-version: ${{ env.JAVA_VERSION }}

