        run: .github/scripts/wait-for-url.sh "http://localhost:4111/actuator/health" 180 5

      - name: Bootstrap TeamCity
        run: .github/scripts/bootstrap-teamcity.sh "${TC_URL}" "${TC_ADMIN_USER}" "${TC_ADMIN_PASS}"

      - name: Wait for TeamCity REST
        run: .github/scripts/wait-for-teamcity-ready.sh "${TC_URL}" "${TC_ADMIN_USER}" "${TC_ADMIN_PASS}" 600 10

      - name: Purge TeamCity agents from backup
        run: .github/scripts/authorize-teamcity-agent.sh purge "${TC_URL}" "${TC_ADMIN_USER}" "${TC_ADMIN_PASS}"

      - name: Start TeamCity agent
        run: docker compose -f "${COMPOSE_FILE}" up -d teamcity-agent

      - name: Disable agent auto-upgrade
        run: |
          CONF=infra/teamcity-agent/conf/buildAgent.properties
          for i in $(seq 1 60); do
            [[ -f "${CONF}" ]] && break
            sleep 2
          done
          if [[ ! -f "${CONF}" ]]; then
            echo "::warning::Agent conf not found, skip upgrade disable"
            exit 0
          fi
          if grep -q 'teamcity.agent.upgrade.disabled=true' "${CONF}"; then
            echo "Auto-upgrade already disabled"
            exit 0
          fi
          sudo chmod a+rw "${CONF}" || chmod a+rw "${CONF}" || true
          echo 'teamcity.agent.upgrade.disabled=true' | sudo tee -a "${CONF}" >/dev/null
          docker restart teamcity-agent
          sleep 20

      - name: Authorize connected TeamCity agent
        run: .github/scripts/authorize-teamcity-agent.sh "${TC_URL}" "${TC_ADMIN_USER}" "${TC_ADMIN_PASS}" 420 5

      - name: Wait for Selenoid
        run: .github/scripts/wait-for-url.sh "http://localhost:4444/status" 180 5

      - name: Run UI tests (Chrome)
        env:
          SELENIDE_REMOTE_URL: http://localhost:4444/wd/hub
        run: >
          ./mvnw -B test
          -Denv=ci-host
          -Dbrowser=chrome
          -Dui.base.url=http://teamcity-server:8111
          -Dexclude.groups=
          -Dgroups=ui
          -Dsurefire.parallel=none
          -Djunit.parallel.enabled=false
          -Dselenide.headless=true
          -Dallure.results.directory=target/allure-results-chrome

      - name: Collect Selenoid logs
        if: always()
        run: |
          mkdir -p artifacts/selenoid

          echo "=== Selenoid container logs ==="
          docker logs selenoid-teamcity --tail 500 > artifacts/selenoid/selenoid-container.log 2>&1 || true

          echo "=== Selenoid status ==="
          curl -s http://localhost:4444/status | python3 -m json.tool > artifacts/selenoid/status.json 2>/dev/null || true

          echo "=== Selenoid sessions ==="
          curl -s http://localhost:4444/sessions | python3 -m json.tool > artifacts/selenoid/sessions.json 2>/dev/null || true

          docker exec selenoid-teamcity find /opt/selenoid/logs -name "*.log" -exec cat {} \; > artifacts/selenoid/container-logs.txt 2>/dev/null || true

          docker exec selenoid-teamcity ls -la /opt/selenoid/logs/ > artifacts/selenoid/logs-list.txt 2>/dev/null || true

          if [ -d "./selenoid/video" ] && [ "$(ls -A ./selenoid/video)" ]; then
            mkdir -p artifacts/selenoid/videos
            cp -r ./selenoid/video/* artifacts/selenoid/videos/ 2>/dev/null || true
            echo "✅ Videos collected: $(ls -la ./selenoid/video | wc -l) files"
          else
            echo "ℹ️ No videos found"
          fi

          echo "=== Selenoid artifacts size ==="
          du -sh ./selenoid/video 2>/dev/null || echo "No video folder"
          du -sh ./selenoid/logs 2>/dev/null || echo "No logs folder"

          echo "✅ Selenoid logs collected"

      - name: Collect docker logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose -f "${COMPOSE_FILE}" logs --no-color > artifacts/docker-compose-ui-chrome.log || true

      - name: Upload UI Chrome artifacts
        if: always()
        uses: ./.github/actions/upload-ci-artifacts
        with:
          name: ui-chrome-artifacts
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          path: |
            target/surefire-reports/**
            target/allure-results-chrome/**
            artifacts/docker-compose-ui-chrome.log
            artifacts/selenoid/**
            build/reports/tests/**

      - name: Stop stack
        if: always()
        run: docker compose -f "${COMPOSE_FILE}" down -v

