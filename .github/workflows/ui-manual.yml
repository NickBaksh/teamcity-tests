# Manual UI matrix (Chrome / Firefox via Selenoid on the host runner).
name: UI Tests (Manual)

on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - both

env:
  JAVA_VERSION: "21"
  COMPOSE_FILE: infra/docker-compose.yml
  TC_URL: http://localhost:8111
  TC_ADMIN_USER: admin
  TC_ADMIN_PASS: admin
  TC_DATADIR: infra/teamcity-server/data
  TEAMCITY_IMAGE: jetbrains/teamcity-server:2026.1.1
  TEAMCITY_BACKUP_TAG: teamcity-backup-v1
  ARTIFACT_RETENTION_DAYS: "7"

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.browser == 'both' && '["chrome", "firefox"]' || format('["{0}"]', inputs.browser)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java + Maven
        uses: ./.github/actions/setup-java-maven
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Make scripts / wrapper executable
        run: |
          chmod +x .github/scripts/*.sh
          chmod +x mvnw

      - name: Pull images
        run: |
          docker compose -f "${COMPOSE_FILE}" pull teamcity-server teamcity-agent selenoid selenoid-ui
          docker pull selenoid/chrome:126.0
          docker pull selenoid/firefox:127.0

      - name: Seed TeamCity datadir from release backup
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: .github/scripts/seed-teamcity-datadir.sh "${TC_DATADIR}"

      - name: Prepare TeamCity agent directories
        run: |
          mkdir -p infra/teamcity-agent/conf infra/teamcity-agent/work
          chmod -R a+rwx infra/teamcity-agent

      - name: Start TeamCity + Selenoid + backend
        run: |
          docker compose -f "${COMPOSE_FILE}" up -d teamcity-server selenoid selenoid-ui
          docker compose -f "${COMPOSE_FILE}" up -d postgres backend

      - name: Wait for services
        run: |
          .github/scripts/wait-for-url.sh "${TC_URL}/login.html" 420 10
          .github/scripts/wait-for-url.sh "http://localhost:4111/actuator/health" 180 5
          .github/scripts/wait-for-url.sh "http://localhost:4444/status" 180 5

      - name: Bootstrap TeamCity
        run: .github/scripts/bootstrap-teamcity.sh "${TC_URL}" "${TC_ADMIN_USER}" "${TC_ADMIN_PASS}"

      - name: Wait for TeamCity REST
        run: .github/scripts/wait-for-teamcity-ready.sh "${TC_URL}" "${TC_ADMIN_USER}" "${TC_ADMIN_PASS}" 600 10

      - name: Purge and start authorized agent
        run: |
          .github/scripts/authorize-teamcity-agent.sh purge "${TC_URL}" "${TC_ADMIN_USER}" "${TC_ADMIN_PASS}"
          docker compose -f "${COMPOSE_FILE}" up -d teamcity-agent
          CONF=infra/teamcity-agent/conf/buildAgent.properties
          for i in $(seq 1 60); do
            [[ -f "${CONF}" ]] && break
            sleep 2
          done
          if [[ -f "${CONF}" ]] && ! grep -q 'teamcity.agent.upgrade.disabled=true' "${CONF}"; then
            sudo chmod a+rw "${CONF}" || chmod a+rw "${CONF}" || true
            echo 'teamcity.agent.upgrade.disabled=true' | sudo tee -a "${CONF}" >/dev/null
            docker restart teamcity-agent
            sleep 20
          fi
          .github/scripts/authorize-teamcity-agent.sh "${TC_URL}" "${TC_ADMIN_USER}" "${TC_ADMIN_PASS}" 420 5

      - name: Run UI tests (${{ matrix.browser }})
        env:
          SELENIDE_REMOTE_URL: http://localhost:4444/wd/hub
        run: >
          ./mvnw -B test
          -Denv=ci-host
          -Dbrowser=${{ matrix.browser }}
          -Dui.base.url=http://teamcity-server:8111
          -Dexclude.groups=
          -Dgroups=ui
          -Dsurefire.parallel=none
          -Djunit.parallel.enabled=false
          -Dselenide.headless=true
          -Dallure.results.directory=target/allure-results-${{ matrix.browser }}

      - name: Upload artifacts
        if: always()
        uses: ./.github/actions/upload-ci-artifacts
        with:
          name: ui-tests-${{ matrix.browser }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          path: |
            target/surefire-reports/**
            target/allure-results-${{ matrix.browser }}/**
            build/reports/tests/**

      - name: Stop stack
        if: always()
        run: docker compose -f "${COMPOSE_FILE}" down -v
