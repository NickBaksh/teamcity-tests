name: Setup Java + Maven cache
description: Checkout-ready Java 21 with Maven dependency cache

inputs:
  java-version:
    description: Java version
    required: false
    default: "21"

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: maven
